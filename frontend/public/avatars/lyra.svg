  <path d="M75 155 L100 180 L125 155 Z" fill="#00F2FE" opacity="0.8"/>
  <!-- Neck & Face -->
  <path d="M88 135 L112 135 L110 155 L90 155 Z" fill="#FAD4C0"/>
  <path d="M68 95 C68 135, 132 135, 132 95 C132 65, 68 65, 68 95 Z" fill="#FFE5D9"/>
  <!-- Hair front -->
  <path d="M65 85 C65 50, 135 50, 135 85 C120 70, 80 70, 65 85 Z" fill="url(#lyra-hair)"/>
  <path d="M65 85 C60 120, 75 135, 75 135 C70 110, 75 95, 80 85 Z" fill="url(#lyra-hair)"/>
  <path d="M135 85 C140 120, 125 135, 125 135 C130 110, 125 95, 120 85 Z" fill="url(#lyra-hair)"/>
  <!-- Cyber Glasses / Visor -->
  <rect x="74" y="92" width="52" height="16" rx="4" fill="rgba(0, 242, 254, 0.3)" stroke="#00F2FE" stroke-width="2"/>
  <line x1="100" y1="92" x2="100" y2="108" stroke="#00F2FE" stroke-width="1.5"/>
  <!-- Blush -->
  <circle cx="78" cy="115" r="5" fill="#FF5E7E" opacity="0.4"/>
  <circle cx="122" cy="115" r="5" fill="#FF5E7E" opacity="0.4"/>
  <!-- Smile -->
