  </defs>
  <rect width="200" height="200" rx="24" fill="url(#lyra-bg)"/>
  <!-- Cyber aura -->
  <circle cx="100" cy="95" r="75" stroke="#9D4EDD" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- Hair back -->
  <path d="M50 100 C40 160, 60 180, 75 190 L125 190 C140 180, 160 160, 150 100 Z" fill="url(#lyra-hair)"/>
